<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0d10" />
    <title>Legendary OS</title>
    <style>
      html,body{margin:0;background:#10110f;color:#f2efe7}.site-entry{min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 70% 30%,rgba(193,166,111,.12),transparent 65%)}.site-entry__brand{display:grid;justify-items:center;gap:14px}.site-entry__mark{display:grid;place-items:center;width:62px;height:62px;border:1px solid rgba(242,239,231,.4);border-radius:50%;font:32px Georgia,serif;margin-bottom:10px}.site-entry strong{font:500 17px/1.2 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.25em}.site-entry small{font:10px/1.5 system-ui,sans-serif;text-transform:uppercase;letter-spacing:.3em;color:#c4c5bc}
    </style>
  </head>
  <body>
    <div id="root"><div class="site-entry"><div class="site-entry__brand"><span class="site-entry__mark">L</span><strong>Legendary</strong><small id="entry-brand">Contractors</small></div></div></div>
    <script>if(/^\/scapes(?:\/|$)|^\/site\/[^/]*scapes/i.test(location.pathname)){document.body.style.background='#183126';document.getElementById('entry-brand').textContent='Scapes';}</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
