<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAD Lab | Legendary OS</title>
    <meta name="description"
        content="A contained Legendary OS prototype for floor planning, takeoffs, visual estimates and project design.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-green: #1f3a2e;
            --primary-green-light: #4a6b5d;
            --secondary-green: #4a7462;
            --light-green: #5a8472;
            --accent-green: #6a9482;
            --cream: #f5f3ef;
            --warm-gray: #4a4a4a;
            --light-gray: #e8e8e8;
            --gold: #c9a961;
            --white: #ffffff;
            --off-white: #fafafa;
            --dark: #1a1a1a;
            --panel-bg: rgba(255, 255, 255, 0.95);
            --surface-bg: rgba(255, 255, 255, 0.85);
        }

        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(to bottom,
                    var(--white) 0%,
                    #fcfcfc 15%,
                    #f9faf9 30%,
                    #f6f8f6 50%,
                    #f3f6f4 70%,
                    #f0f4f2 85%,
                    var(--cream) 100%);
            color: var(--warm-gray);
            overflow: hidden;
            height: 100vh;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Space Grotesk', sans-serif;
            color: var(--dark);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        /* Navigation - Glassmorphic */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(30px) saturate(180%);
            -webkit-backdrop-filter: blur(30px) saturate(180%);
            border-bottom: 1px solid rgba(58, 90, 77, 0.1);
            z-index: 1000;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scaleY(1);
            transform-origin: top;
        }

        .navbar.scrolled {
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 4px 30px rgba(58, 90, 77, 0.12);
            transform: scaleY(0.95);
        }

        .nav-container {
            max-width: 100%;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: padding 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar.scrolled .nav-container {
            padding: 0.75rem 2rem;
        }

        .logo {
            display: flex;
            align-items: center;
            text-decoration: none;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .navbar.scrolled .logo {
            transform: scale(0.95);
        }

        .logo img {
            height: 50px;
            width: auto;
            object-fit: contain;
        }

        .nav-menu {
            display: flex;
            align-items: center;
            gap: 2rem;
            list-style: none;
        }

        .nav-link {
            color: var(--warm-gray);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }

        .nav-link:hover {
            color: var(--primary-green);
        }

        .flex { display: flex; }
        .flex-1 { flex: 1 1 auto; min-width: 0; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .gap-4 { gap: 1rem; }
        .cad-container > .flex-1 { height: 100%; overflow: hidden; }

        /* Main Layout */
        .cad-container {
            display: flex;
            height: 100vh;
            padding-top: 70px;
        }

        /* Sidebar */
        .sidebar {
            width: 70px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(58, 90, 77, 0.1);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 0;
            gap: 0.5rem;
        }

        .sidebar-btn {
            width: 45px;
            height: 45px;
            border-radius: 10px;
            border: none;
            background: transparent;
            color: var(--warm-gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .sidebar-btn:hover {
            background: rgba(58, 90, 77, 0.1);
            color: var(--primary-green);
        }

        .sidebar-btn.active {
            background: rgba(58, 90, 77, 0.15);
            color: var(--primary-green);
        }

        /* Toolbar */
        .toolbar {
            height: 60px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(58, 90, 77, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.5rem;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(58, 90, 77, 0.05);
            padding: 0.5rem;
            border-radius: 12px;
            border: 1px solid rgba(58, 90, 77, 0.1);
        }

        .tool-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: none;
            background: transparent;
            color: var(--warm-gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .tool-btn:hover {
            background: rgba(58, 90, 77, 0.1);
            color: var(--primary-green);
        }

        .tool-btn.active {
            background: rgba(58, 90, 77, 0.2);
            color: var(--primary-green);
        }

        .ai-btn {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1rem;
            background: rgba(58, 90, 77, 0.1);
            border: 1px solid rgba(58, 90, 77, 0.2);
            border-radius: 10px;
            color: var(--primary-green);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .ai-btn:hover {
            background: rgba(58, 90, 77, 0.2);
            border-color: var(--primary-green);
        }

        /* Main Workspace */
        .workspace {
            flex: 1;
            display: flex;
            min-width: 0;
            overflow: hidden;
        }

        /* Left Panel - Scene/Assets */
        .left-panel {
            width: 280px;
            flex: 0 0 280px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(58, 90, 77, 0.1);
            display: flex;
            flex-direction: column;
        }

        .panel-tabs {
            display: flex;
            border-bottom: 1px solid rgba(58, 90, 77, 0.1);
        }

        .panel-tab {
            flex: 1;
            padding: 1rem;
            background: transparent;
            border: none;
            border-bottom: 2px solid transparent;
            color: var(--warm-gray);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .panel-tab.active {
            color: var(--primary-green);
            border-bottom-color: var(--primary-green);
        }

        .panel-content {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .scene-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .scene-item:hover {
            background: rgba(58, 90, 77, 0.05);
        }

        .scene-item.selected {
            background: rgba(58, 90, 77, 0.1);
            border: 1px solid rgba(58, 90, 77, 0.2);
        }

        /* Viewport */
        .viewport {
            flex: 1 1 auto;
            min-width: 0;
            background: var(--cream);
            position: relative;
            overflow: hidden;
        }

        .viewport-grid {
            background-image:
                linear-gradient(rgba(58, 90, 77, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(58, 90, 77, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            width: 100%;
            height: 100%;
        }

        .viewport-controls {
            position: absolute;
            top: 1rem;
            right: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            z-index: 10;
        }

        .control-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(58, 90, 77, 0.1);
            color: var(--warm-gray);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background: rgba(58, 90, 77, 0.1);
            color: var(--primary-green);
        }

        /* AI Prompt Bar */
        .ai-prompt-bar {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            z-index: 10;
        }

        .ai-prompt-container {
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(58, 90, 77, 0.2);
            border-radius: 16px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            box-shadow: 0 8px 32px rgba(58, 90, 77, 0.15);
            transition: all 0.3s ease;
        }

        .ai-prompt-container:hover {
            border-color: var(--primary-green);
            box-shadow: 0 12px 40px rgba(58, 90, 77, 0.2);
        }

        .ai-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary-green), var(--secondary-green));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            flex-shrink: 0;
        }

        .ai-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--dark);
            font-size: 0.95rem;
            font-family: 'DM Sans', sans-serif;
        }

        .ai-input::placeholder {
            color: var(--warm-gray);
        }

        .ai-send-btn {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: var(--primary-green);
            border: none;
            color: var(--white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .ai-send-btn:hover {
            background: var(--primary-green-light);
            transform: scale(1.05);
        }

        /* Right Panel - Properties */
        .right-panel {
            width: 320px;
            flex: 0 0 320px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border-left: 1px solid rgba(58, 90, 77, 0.1);
            overflow-y: auto;
        }

        .property-section {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(58, 90, 77, 0.1);
        }

        .property-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--warm-gray);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .property-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .property-input {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            padding: 0.5rem;
            background: rgba(58, 90, 77, 0.05);
            border: 1px solid rgba(58, 90, 77, 0.1);
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .property-input:hover {
            border-color: var(--primary-green);
        }

        .property-label {
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--primary-green);
        }

        .property-value {
            background: transparent;
            border: none;
            outline: none;
            color: var(--dark);
            font-size: 0.85rem;
            font-family: 'Space Grotesk', monospace;
            width: 100%;
        }

        /* Upload Area */
        .upload-area {
            border: 2px dashed rgba(58, 90, 77, 0.3);
            border-radius: 12px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .upload-area:hover {
            border-color: var(--primary-green);
            background: rgba(58, 90, 77, 0.05);
        }

        .upload-area.dragover {
            border-color: var(--primary-green);
            background: rgba(58, 90, 77, 0.1);
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(58, 90, 77, 0.2);
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(58, 90, 77, 0.3);
        }

        /* Loading State */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            color: var(--primary-green);
            font-weight: 600;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(58, 90, 77, 0.2);
            border-top-color: var(--primary-green);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Image Preview */
        .image-preview {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 1rem;
            border: 1px solid rgba(58, 90, 77, 0.1);
        }

        /* Button Styles */
        .btn-primary {
            background: var(--primary-green);
            color: var(--white);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: var(--primary-green-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(58, 90, 77, 0.25);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary-green);
            border: 1px solid rgba(58, 90, 77, 0.2);
            padding: 0.75rem 1.5rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: rgba(58, 90, 77, 0.05);
            border-color: var(--primary-green);
        }
        .legendary-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.7rem;
            color: var(--dark);
            text-decoration: none;
        }
        .legendary-logo-mark {
            width: 36px;
            height: 36px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: #111715;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
        }
        .legendary-logo-copy {
            display: flex;
            flex-direction: column;
            line-height: 1.05;
        }
        .legendary-logo-copy strong { font-size: 0.9rem; }
        .legendary-logo-copy small {
            margin-top: 0.2rem;
            color: var(--warm-gray);
            font-size: 0.68rem;
        }
        body.is-embedded .navbar { display: none; }
        body.is-embedded .cad-container { height: 100vh; padding-top: 0; }
        body.is-embedded .sidebar > a:first-child { display: none; }

        .prototype-badge {
            display: inline-flex;
            align-items: center;
            min-height: 28px;
            padding: 0 0.65rem;
            border: 1px solid rgba(15, 143, 131, 0.22);
            border-radius: 999px;
            background: rgba(225, 242, 239, 0.78);
            color: #0b766d;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <script>
        if (window.self === window.top && window.location.pathname.startsWith('/cad-lab')) {
            window.location.replace('/dashboard/cad');
        } else if (window.self !== window.top) {
            document.body.classList.add('is-embedded');
        }
    </script>
    <!-- Navigation -->
    <nav class="navbar" id="navbar">
        <div class="nav-container">
            <a href="/dashboard" class="logo legendary-logo" aria-label="Back to Legendary OS">
                <span class="legendary-logo-mark">L</span>
                <span class="legendary-logo-copy"><strong>Legendary OS</strong><small>Design Lab</small></span>
            </a>

            <ul class="nav-menu">
                <li><a href="/dashboard" class="nav-link">Home</a></li>
                <li><a href="/projects" class="nav-link">Projects</a></li>
                <li><a href="/media" class="nav-link">Media</a></li>
                <li><a href="/dashboard/cms" class="nav-link">Websites</a></li>
            </ul>
        </div>
    </nav>

    <div class="cad-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="/dashboard" class="sidebar-btn" title="Back to Dashboard">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="m12 19-7-7 7-7M19 12H5" />
                </svg>
            </a>
            <button class="sidebar-btn active" data-tool="select" title="Select">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12.586 12.586 19 19" />
                    <path
                        d="M3.688 3.037a.497.497 0 0 0-.651.651l6.5 15.999a.501.501 0 0 0 .947-.062l1.569-6.083a2 2 0 0 1 1.448-1.479l6.124-1.579a.5.5 0 0 0 .063-.947z" />
                </svg>
            </button>
            <button class="sidebar-btn" data-tool="measure" title="Measure">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
                    <circle cx="12" cy="10" r="3" />
                </svg>
            </button>
            <button class="sidebar-btn" data-tool="draw" title="Draw">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z" />
                </svg>
            </button>
            <button class="sidebar-btn" data-tool="floor" title="Add Floor">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                </svg>
            </button>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col">
            <!-- Toolbar -->
            <div class="toolbar">
                <div class="flex items-center gap-4">
                    <div class="tool-group">
                        <button class="tool-btn active" data-tool="select">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M12.586 12.586 19 19" />
                                <path
                                    d="M3.688 3.037a.497.497 0 0 0-.651.651l6.5 15.999a.501.501 0 0 0 .947-.062l1.569-6.083a2 2 0 0 1 1.448-1.479l6.124-1.579a.5.5 0 0 0 .063-.947z" />
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="move">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M12 2v20" />
                                <path d="m15 19-3 3-3-3" />
                                <path d="m19 9 3 3-3 3" />
                                <path d="M2 12h20" />
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="rotate">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path
                                    d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2" />
                            </svg>
                        </button>
                    </div>

                    <div style="width: 1px; height: 24px; background: rgba(58, 90, 77, 0.2);"></div>

                    <button class="ai-btn" onclick="openAIModal()">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M12 2v4M6 6l-2 2M2 12h4M6 18l-2-2M12 22v-4M18 18l2-2M22 12h-4M18 6l2 2" />
                            <circle cx="12" cy="12" r="3" />
                        </svg>
                        AI Generate
                    </button>

                    <div style="width: 1px; height: 24px; background: rgba(58, 90, 77, 0.2);"></div>

                    <button class="tool-btn" onclick="addFloorPlan()" title="Add Floor Plan">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" />
                        </svg>
                    </button>
                    <button class="tool-btn" onclick="addWall()" title="Add Wall">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M3 12h18M3 6h18M3 18h18" />
                        </svg>
                    </button>
                    <button class="tool-btn" onclick="addDoor()" title="Add Door">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M18 20V6a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v14" />
                            <path d="M2 6h20" />
                            <path d="M14 12h.01" />
                        </svg>
                    </button>
                    <button class="tool-btn" onclick="addWindow()" title="Add Window">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
