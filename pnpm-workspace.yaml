packages:
  - frontend
  - backend
  - services/*
  - iaminfra/*

# pnpm 11 blocks dependency install scripts unless they are explicitly allowed.
# Keep this list narrow and intentional for Cloudflare/Vite + Agent Sam SDK tooling.
allowBuilds:
  esbuild: true
  workerd: true
  node-pty: true
  '@inneranimalmedia/agentsam-sdk': true

minimumReleaseAgeExclude:
  - '@inneranimalmedia/agentsam-sdk@2.0.0-alpha.identity.5'
