packages:
  - frontend
  - backend
  - services/*

# pnpm 11 blocks dependency install scripts unless they are explicitly allowed.
# Keep this list narrow and intentional for Cloudflare/Vite + Agent Sam SDK tooling.
allowBuilds:
  esbuild: true
  workerd: true
  node-pty: true
  '@inneranimalmedia/agentsam-sdk': true

minimumReleaseAgeExclude:
  - '@inneranimalmedia/agentsam-sdk'

patchedDependencies:
  '@inneranimalmedia/agentsam-sdk@2.6.12': patches/@inneranimalmedia__agentsam-sdk@2.6.12.patch
  '@inneranimalmedia/agentsam-work@2.6.12': patches/@inneranimalmedia__agentsam-work@2.6.12.patch
